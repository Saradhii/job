<!doctype html>
<html><head><meta charset="utf-8"><title>Apply — Sample Greenhouse</title></head>
<body>
  <h1>Apply for Software Engineer</h1>
  <form>
    <label>First Name <input id="first" name="first" type="text"></label><br><br>
    <label>Last Name <input id="last" name="last" type="text"></label><br><br>
    <label>Email <input id="email" name="email" type="email"></label><br><br>
    <label>Phone <input id="phone" name="phone" type="tel"></label><br><br>
    <label>LinkedIn URL <input id="li" name="li" type="text"></label><br><br>
    <label>What is your expected compensation?
      <input id="sal" name="sal" type="text" inputmode="numeric" placeholder="$90,000">
    </label><br><br>
    <fieldset>
      <legend>Work Authorization</legend>
      <label><input type="checkbox" id="auth"> Are you legally authorized to work in the US?</label><br>
      <label><input type="checkbox" id="spon"> Do you now or will you require sponsorship?</label>
    </fieldset><br>
    <label>How did you hear about us?
      <select id="source">
        <option value="">Select…</option>
        <option>LinkedIn</option>
        <option>Referral</option>
        <option>Other</option>
      </select>
    </label><br><br>
    <label>Why this role? <textarea id="why"></textarea></label><br><br>
  </form>
</body></html>
