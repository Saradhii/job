<!doctype html>
<html><head><meta charset="utf-8"><title>Apply — SDE II (India)</title></head>
<body>
  <h1>Apply for Software Engineer II — Bangalore</h1>
  <form>
    <label>Full Name <input id="name" name="name" type="text"></label><br><br>
    <label>Email <input id="email" name="email" type="email"></label><br><br>
    <label>Phone <input id="phone" name="phone" type="tel"></label><br><br>
    <label>LinkedIn URL <input id="li" name="li" type="text"></label><br><br>

    <fieldset>
      <legend>Experience</legend>
      <label>Total Experience (in years)
        <input id="exp" name="exp" type="text" inputmode="decimal" placeholder="3.5">
      </label><br><br>
      <label>Current Company <input id="cc" name="cc" type="text"></label><br><br>
      <label>Current Designation <input id="cd" name="cd" type="text"></label><br><br>
      <label>Current CTC (Annual)
        <input id="cctc" name="cctc" type="text" placeholder="₹18,00,000">
      </label><br><br>
      <label>Expected CTC (Annual)
        <input id="ectc" name="ectc" type="text" placeholder="₹24,00,000">
      </label><br><br>
      <label>Official Notice Period
        <input id="np" name="np" type="text" placeholder="60 days">
      </label><br><br>
    </fieldset>

    <label>Are you willing to relocate?
      <select id="relo">
        <option value="">Select…</option>
        <option>Yes</option>
        <option>No</option>
      </select>
    </label><br><br>

    <label>Why this role? <textarea id="why"></textarea></label><br><br>
  </form>
</body></html>
