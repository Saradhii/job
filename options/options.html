<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { font: 14px system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  textarea { width: 100%; height: 320px; font: 12px monospace; }
  label { display:block; margin: 12px 0 4px; font-weight: 600; }
  input[type="text"], input[type="password"] { width: 100%; padding: 6px; font-size: 14px; box-sizing: border-box; }
  button { padding: 8px 16px; margin-top: 12px; cursor: pointer; }
  #msg { color: #070; margin-top: 8px; min-height: 1em; }
</style></head>
<body>
  <h2>Profile</h2>
  <p style="font-size:12px;color:#666">Edit as JSON. See schema in <code>src/profile.js</code>.</p>
  <textarea id="profile"></textarea>
  <label>OpenAI API key</label>
  <input id="apikey" type="password">
  <label>Model</label>
  <input id="model" type="text" placeholder="gpt-4o-mini">
  <button id="save">Save</button>
  <div id="msg"></div>
  <script src="../src/profile.js"></script>
  <script src="../src/storage.js"></script>
  <script src="options.js"></script>
</body></html>
